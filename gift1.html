<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift 1 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f001a, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* Magical Heart */
    .heart {
      position: relative;
      width: 150px;
      height: 135px;
      background: #ff004c;
      transform: rotate(-45deg);
      animation: flip 4s infinite linear;
      box-shadow: 0 0 40px #ff0066, 0 0 80px #ff3399;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #ff004c;
    }

    .heart::before {
      top: -75px;
      left: 0;
    }

    .heart::after {
      left: 75px;
      top: 0;
    }

    /* Animation */
    @keyframes flip {
      0%   { transform: rotate(-45deg) rotateY(0deg); }
      50%  { transform: rotate(-45deg) rotateY(180deg); }
      100% { transform: rotate(-45deg) rotateY(360deg); }
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 30px;
      color: #ff99cc;
      text-shadow: 0 0 20px #ff66cc, 0 0 40px #ff3399;
    }

    p {
      font-size: 1.3rem;
      color: #ffd6f3;
      margin: 15px 0;
      text-shadow: 0 0 10px #ff66cc, 0 0 20px #ff3399;
    }

    .msg {
      font-size: 1.2rem;
      color: #ffe6fa;
      max-width: 700px;
      line-height: 1.8;
      margin: 20px auto 30px;
      text-shadow: 0 0 15px #ff66cc;
    }

    /* Back Button */
    .btn {
      background: #ff3399;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px #ff66cc;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #ff66cc;
      box-shadow: 0 0 30px #ff3399;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="heart"></div>
  <h1>💖 Happy Birthday Kajal Didi 💖</h1>
  <p>You deserve a world filled with endless love & shining magic ✨</p>
  
  <!-- Added heartfelt message -->
  <div class="msg">
    Kajal Didi, you are not just a sister — you are my role model, my strongest cheerleader, and my best friend. 💖<br>
    This birthday, I just want you to know how much I love you and how lucky I am to have you! 🌟
  </div>
  
  <a href="surprise.html"><button class="btn">← Back to Gifts</button></a>

   <!-- Birthday Song -->
  <audio autoplay loop>
    <source src="happy_birthday.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
