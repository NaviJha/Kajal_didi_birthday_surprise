<!DOCTYPE html>
<html lang="en">
<head>
     <!-- hint to click on the gift box to open it -->
  <div class="hint">Click on the gift box</div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift 7 🎁</title>
 
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a0033, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      overflow-y: auto; /* scroll enabled */
    }

    /* Gift Box */
    .gift-box {
      position: relative;
      width: 150px;
      height: 150px;
      background: #ff3399;
      border-radius: 10px;
      box-shadow: 0 0 20px #ff66cc;
      cursor: pointer;
      animation: bounce 1.5s infinite;
    }

    .gift-box::before {
      content: "";
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 40px;
      background: #ff66cc;
      border-radius: 10px 10px 0 0;
      
    }

    .gift-box::after {
      content: "";
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff0066;
      box-shadow: -25px 0 #ff0066, 25px 0 #ff0066;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Hidden Surprise */
    .message {
      display: none;
      font-size: 1.5rem;
      margin-top: 20px;
      color: #ffccff;
      text-shadow: 0 0 10px #ff66cc, 0 0 20px #ff3399;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 8px;
      height: 14px;
      background: #ffcc00;
      opacity: 0.8;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-100vh) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    /* Back Button */
    .btn {
      margin-top: 30px;
      background: #ff3399;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px #ff66cc;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #ff66cc;
      box-shadow: 0 0 30px #ff3399;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Gift Box -->
  <div class="gift-box" onclick="openGift()"></div>
  

  <!-- Surprise Message -->
  <div class="message" id="message">
    🎉 Surprise! 🎉 <br>
    Happy Birthday Kajal Didi 💖 <br>
    You are truly the most special gift in our lives ✨
  </div>

  <a href="surprise.html"><button class="btn">← Back to Surprise</button></a>

  <script>
    function openGift() {
      document.querySelector('.gift-box').style.display = "none";
      document.getElementById("message").style.display = "block";

      // Generate Confetti
      for (let i = 0; i < 50; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => { confetti.remove(); }, 5000);
      }
    }
  </script>
  <!-- Birthday Song -->
  <audio autoplay loop>
    <source src="happy_birthday.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
