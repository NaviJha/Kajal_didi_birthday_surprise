<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Kajal Didi 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Segoe+UI&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background-animation"></div>
  <div class="container">
    <h1>🎂 Happy Birthday Kajal Didi 🎂</h1>
    <p class="message">The stars are shining, the clock is ticking... a magical moment awaits! 💖</p>

    <div class="countdown" id="countdown">
      <h2>Surprise Unlocks In:</h2>
      <div class="time-boxes">
        <div><span id="days">00</span>
          <p>Days</p>
        </div>
        <div><span id="hours">00</span>
          <p>Hours</p>
        </div>
        <div><span id="minutes">00</span>
          <p>Minutes</p>
        </div>
        <div><span id="seconds">00</span>
          <p>Seconds</p>
        </div>
      </div>
    </div>

    <div id="surprise" style="display: none;">
      <img src="birthday_cake.png" alt="Cake" class="cake-img">
      <p class="surprise-text">🎁 It's Time! Click below to reveal your surprise!</p>
      <a href="surprise.html" class="reveal-button">💌 Open Your Surprise 💌</a>
      <p class="love-msg">Made with lots of love by Betu 💗</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
