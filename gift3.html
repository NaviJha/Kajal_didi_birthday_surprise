<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift 3 - Photo Album</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .slideshow-container {
      position: relative;
      max-width: 600px;
      margin: auto;
      border-radius: 20px;
      overflow-y: auto; /* scroll enabled */
      box-shadow: 0 0 25px #ff69b4;
      margin-top: 30px;
    }

    .slide {
      display: none;
      width: 100%;
      border-radius: 20px;
    }

    .active-slide {
      display: block;
      animation: fade 1.2s ease-in-out;
    }

    @keyframes fade {
      from {
        opacity: 0.3;
      }

      to {
        opacity: 1;
      }
    }

    

    .back-button {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.3s ease;
    }

    .back-button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎁 Gift 3 - Album</h1>
    <div class="slideshow-container">
      <img src="pic1.jpg" class="slide active-slide" />
      <img src="pic2.jpg" class="slide" />
      <img src="pic3.jpg" class="slide" />
      <img src="pic4.jpg" class="slide" />
      <img src="pic5.jpg" class="slide" />
      <img src="pic6.jpg" class="slide" />
      <img src="pic7.jpg" class="slide" />
      <img src="pic8.jpg" class="slide" />
      <img src="pic9.jpg" class="slide" />
      <img src="pic10.jpg" class="slide" />

    </div>
    <a href="surprise.html" class="back-button">⬅️ Back to Gifts</a>
  </div>

  <script>
    let slideIndex = 0;
    const slides = document.querySelectorAll(".slide");

    function showNextSlide() {
      slides[slideIndex].classList.remove("active-slide");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active-slide");
    }

    setInterval(showNextSlide, 3000);

    
  </script>
  <!-- Birthday Song -->
  <audio autoplay loop>
    <source src="happy_birthday.mp3" type="audio/mpeg">
  </audio>
</body>

</html>
